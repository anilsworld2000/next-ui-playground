name: Run Tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - run: npm ci
      
      - run: npm test
    
      - name: 'notify vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'Vercel - next-ui-playground: run-tests'
          status: 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
